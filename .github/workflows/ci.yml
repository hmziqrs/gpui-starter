name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# CI env for the Zed gpui + gpui-component + gpui-form graph. There is NO `test`
# job here (see the note under `jobs:`): full `cargo test` codegen on this graph
# takes multi-HOUR and busts GitHub's 6 h limit. These knobs serve the fast
# `check`/`clippy`/`fmt` jobs AND stay correct if someone runs `cargo test` locally:
#   - RUST_MIN_STACK=512 MiB  + recursion_limit=8192 (src/lib.rs): gpui_macros
#     recurse through syn past the default stack/limit while expanding; without
#     these the expansion SIGBUS-es (signal 10, a proc-macro THREAD STACK overflow
#     — not heap OOM).
#   - CARGO_BUILD_JOBS=2, *_CODEGEN_UNITS=256, *_DEBUG=none, CARGO_INCREMENTAL=0:
#     peak-RSS hygiene on the 14 GB runner and keep target/ lean.
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
  CARGO_PROFILE_DEV_DEBUG: none
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  CARGO_PROFILE_TEST_DEBUG: none
  RUST_MIN_STACK: "536870912"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"

      - name: Cargo check (dev)
        run: cargo check

      # `cargo check` uses the DEV profile (debug_assertions on), so it is blind
      # to any code behind `#[cfg(not(debug_assertions))]`. That class of debug/
      # release divergence once shipped green here and then broke the release
      # build. This release-profile check is still metadata-only (no codegen), so
      # it adds only a few minutes and catches release-only cfg code in the fast
      # lane — mirroring what `cargo build --release` will actually compile.
      - name: Cargo check (release)
        run: cargo check --release

  # ---------------------------------------------------------------------
  # NOTE: there is intentionally NO `test` job here. `cargo test` on this
  # workspace does FULL codegen of the entire Zed gpui + gpui-component +
  # gpui-form graph (~13 GB of target/), which on the macOS runner is a
  # multi-HOUR build that exceeds GitHub's 6 h job limit (we watched it run
  # 5-6 h and never finish). There is no fast subset either: every crate's
  # tests — even gpui-query's no-gpui `core` feature — import gpui's
  # `TestAppContext`, so they all require compiling Zed from source.
  #
  # Coverage is not lost for the "does it build?" question: the `check` job
  # type-checks AND macro-expands the WHOLE codebase (forms included) in ~8
  # min. The full `cargo test` suite works locally (RUST_MIN_STACK +
  # recursion_limit=8192 in src/lib.rs make the proc-macro expansion succeed
  # instead of SIGBUS-ing) — it is just not viable in CI. Re-enable a CI test
  # job only behind sccache or a self-hosted runner with a persistent target/.
  # ---------------------------------------------------------------------

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos"

      - name: Run clippy
        run: cargo clippy -- -D warnings

  fmt:
    name: Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # ---------------------------------------------------------------------
  # Linux lane: compiles the cfg(target_os = "linux")-gated code paths
  # (compositor, layer_shell, detached/session_env) that the macOS-primary
  # lane never sees. Same no-`test` policy, same stack/codegen discipline.
  # ---------------------------------------------------------------------
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the Linux target cache fully separate from the macOS lane:
          # the gpui git workspace dep is compiled with different cfg flags
          # (x11/wayland) and a shared key would be poisoned across runners.
          prefix-key: "v2-linux"

      - name: Cargo check (dev)
        run: cargo check

      - name: Cargo check (release)
        run: cargo check --release

  clippy-linux:
    name: Clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-linux"

      - name: Run clippy
        run: cargo clippy -- -D warnings
