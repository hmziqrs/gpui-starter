name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Whole-graph (Zed gpui + gpui-component + this app) builds are heavy, and the
# `Test` job historically crashed during test-binary compilation with SIGBUS
# (signal 10). The crash is NOT heap OOM — it is a proc-macro THREAD STACK
# OVERFLOW: gpui_macros recurses through syn while expanding the test target,
# and that recursion is also deeper than the default recursion_limit. So the
# real fix is two knobs, applied to every job:
#   - RUST_MIN_STACK=536870912   proc-macro thread stack large enough to hold the
#                                 ~thousands of syn frames the test target expands
#                                 (paired with recursion_limit=8192 in src/lib.rs).
#   - recursion limit             src/lib.rs sets `#![recursion_limit = "8192"]`.
#
# Why we do NOT cap CARGO_BUILD_JOBS any more: an earlier config set it to 2 to
# avoid "OOM", but that diagnosis was wrong (it was the stack overflow above).
# Capping parallelism made cold compiles take 3h+ on this graph. The remaining
# knobs are peak-memory hygiene so the runner can use all its cores without
# genuinely OOMing on the heavy (gpui) crates:
#   - CARGO_INCREMENTAL=0         no extra incremental state in RAM/disk
#   - *_CODEGEN_UNITS=256         many tiny LLVM modules → lower peak RSS
#   - *_DEBUG=line-tables-only    drop the memory-heavy variable debuginfo
#
# NOTE on build time: target/ for this graph is ~13 GB, which exceeds the 10 GB
# GitHub Actions cache cap, so the target/ cache save fails silently and every
# run compiles Zed's gpui stack cold. Expect the Test job to take ~1-2 h.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_CODEGEN_UNITS: "256"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_MIN_STACK: "536870912"
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Cargo check
        run: cargo check

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run tests
        run: cargo test

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run clippy
        run: cargo clippy -- -D warnings

  fmt:
    name: Formatting
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
