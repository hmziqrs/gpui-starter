name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Build the macOS .app bundle, optionally codesign + notarize, create DMG.
  # -----------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      # Same discipline as ci.yml: large proc-macro stack (avoids SIGBUS),
      # CARGO_BUILD_JOBS=2 (the 14 GB runner swaps with more parallel rustc on
      # the heavy gpui/gpui_component crates), and many codegen units to keep
      # peak RSS down on a release build (optimization-heavy) so it doesn't OOM.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      RUST_MIN_STACK: "536870912"
      RUST_BACKTRACE: "1"
      # Bake the auto-update manifest URL into the binary at compile time
      # (option_env! in src/services/updater/types.rs). MUST match where the
      # publish-release job posts manifest.json (the gh-pages branch → GitHub
      # Pages). Requires GitHub Pages enabled on the gh-pages branch in repo
      # Settings (one-time manual step) for the URL to actually resolve.
      GPUI_UPDATE_MANIFEST_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-macos-release"
          shared-key: "release"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Shared normalizer: strips one leading 'v', validates X.Y.Z. Used by
          # every job so a dispatch typo ("v0.2.0") and the tag form both
          # collapse to "0.2.0" — otherwise we push a "vv0.2.0" tag and a
          # manifest whose version fails semver parsing client-side.
          VALUE="$(./scripts/normalize-version.sh "$RAW")"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Create .app bundle
        id: appbundle
        run: |
          APP_PATH="$(./scripts/create-release-app.sh "${{ steps.version.outputs.value }}")"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # --- Codesigning ---------------------------------------------------
      # Import Developer ID certificate when available; otherwise ad-hoc sign.

      - name: Import signing certificate
        if: env.APPLE_DEV_CERT_P12 != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_DEV_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_DEV_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to keychain search list so codesign can find it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '"')"

      - name: Codesign with Developer ID
        if: env.APPLE_DEV_CERT_P12 != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          IDENTITY="${APPLE_SIGNING_IDENTITY:-'Developer ID Application'}"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" \
            "${{ steps.appbundle.outputs.path }}"

      - name: Ad-hoc codesign
        if: env.APPLE_DEV_CERT_P12 == ''
        run: |
          codesign --force --deep --sign - "${{ steps.appbundle.outputs.path }}"

      # --- Notarization --------------------------------------------------

      - name: Notarize
        if: env.APPLE_DEV_CERT_P12 != '' && env.APPLE_ID != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$(./scripts/create-dmg.sh \
            "${{ steps.appbundle.outputs.path }}" \
            "target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg")"

          # Submit for notarization.
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket.
          xcrun stapler staple "$DMG_PATH"

          echo "notarized_dmg=$DMG_PATH" >> "$GITHUB_ENV"

      # --- DMG creation (when not already created during notarization) ---

      - name: Create DMG
        if: env.notarized_dmg == ''
        run: |
          ./scripts/create-dmg.sh \
            "${{ steps.appbundle.outputs.path }}" \
            "target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg"

      - name: Determine final DMG path
        id: dmg
        run: |
          if [ -n "${notarized_dmg:-}" ]; then
            echo "path=${notarized_dmg}" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPUI-Starter-${{ steps.version.outputs.value }}.dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Build the Linux release tarball (x86_64 on GHA, aarch64 on a native ARM
  # runner). patchelf adds an $ORIGIN/lib rpath and the build bundles the
  # needed .so files next to the binary — WITHOUT rpath+bundling a linux
  # tarball fails to start on any machine lacking the exact system libs.
  # -----------------------------------------------------------------------
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      # Same discipline as build-macos / ci.yml.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      RUST_MIN_STACK: "536870912"
      RUST_BACKTRACE: "1"
      GPUI_UPDATE_MANIFEST_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json"

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-linux-release"
          shared-key: "release-${{ matrix.arch }}"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VALUE="$(./scripts/normalize-version.sh "$RAW")"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Relink rpath and bundle shared libraries
        run: |
          set -euo pipefail
          STAGE="stage/gpui-starter"
          mkdir -p "$STAGE/lib"
          cp "target/release/gpui-starter" "$STAGE/gpui-starter"

          # Add an $ORIGIN/lib runpath so the binary finds the bundled libs
          # without requiring them system-wide on the user's machine. patchelf
          # is required: a linux tarball without an rpath is broken.
          patchelf --set-rpath '$ORIGIN/lib' "$STAGE/gpui-starter" \
            || { echo "Error: patchelf not available or failed (rpath step is mandatory)" >&2; exit 1; }

          # Bundle the non-system shared libs the binary actually needs.
          # libGL/libvulkan/wayland/xcb live here so the binary is portable;
          # glibc / ld-linux are left to the system (bundling those breaks).
          for lib in $(ldd "$STAGE/gpui-starter" | awk '/=> \// {print $3}'); do
            base="$(basename "$lib")"
            case "$base" in
              libc.so*|libm.so*|libdl.so*|librt.so*|libpthread.so*|ld-linux*|libgcc_s.so*|libutil.so*|libresolv.so*)
                # System-provided; never bundle (breaks across glibc versions).
                continue
                ;;
            esac
            [ -f "$STAGE/lib/$base" ] || cp -L "$lib" "$STAGE/lib/"
          done

          # Ship LICENSE + README for the tarball + PKGBUILD packaging step.
          cp LICENSE "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true

      - name: Generate PKGBUILD
        run: |
          mkdir -p stage
          TARBALL="gpui-starter-${{ steps.version.outputs.value }}-${{ matrix.arch }}-linux.tar.gz"
          ./scripts/gen-pkgbuild.sh "${{ steps.version.outputs.value }}" "$TARBALL" > stage/PKGBUILD

      - name: Create Linux tarball
        id: tarball
        run: |
          cd stage
          TARBALL="gpui-starter-${{ steps.version.outputs.value }}-${{ matrix.arch }}-linux.tar.gz"
          # `gpui-starter` is the self-contained dir (binary + lib/ + LICENSE +
          # README) built by the Relink step; `lib`/`LICENSE`/`README.md` live
          # INSIDE it, not as peers in stage/, so they must not be listed here
          # (GNU tar exits 2 "Cannot stat" on the missing names -> step fails).
          tar -czf "$TARBALL" gpui-starter PKGBUILD
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "name=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpui-starter-${{ steps.version.outputs.value }}-${{ matrix.arch }}-linux
          path: stage/${{ steps.tarball.outputs.path }}
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Create GitHub Release and publish the update manifest to gh-pages.
  # -----------------------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Shared normalizer (see scripts/normalize-version.sh). Identical to
          # the build-macos / build-linux steps so every job agrees on the
          # version without duplicating the strip+validate logic.
          VALUE="$(./scripts/normalize-version.sh "$RAW")"
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: GPUI-Starter-${{ steps.version.outputs.value }}.dmg
          path: ./artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          # merge-multiple so both arches land flat in ./artifacts.
          pattern: gpui-starter-${{ steps.version.outputs.value }}-*-linux
          merge-multiple: true
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            ./artifacts/GPUI-Starter-${{ steps.version.outputs.value }}.dmg
            ./artifacts/gpui-starter-${{ steps.version.outputs.value }}-x86_64-linux.tar.gz
            ./artifacts/gpui-starter-${{ steps.version.outputs.value }}-aarch64-linux.tar.gz

      - name: Generate and publish update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          GITHUB_REPO="${{ github.repository }}"

          # Install the Python signing dependency. ubuntu-latest does NOT ship
          # the `cryptography` module, so without this Ed25519 signing silently
          # no-ops (see scripts/generate-manifest.sh). Gated on the secret so
          # non-signing runs are a no-op.
          if [ -n "${UPDATE_SIGNING_KEY:-}" ]; then
            python3 -m pip install --user --break-system-packages cryptography
          fi

          # Generate manifest JSON from the GitHub Release assets.
          ./scripts/generate-manifest.sh \
            "${{ steps.version.outputs.value }}" \
            "$GITHUB_REPO" \
            manifest.json

          cat manifest.json

          # Publish manifest.json to the gh-pages branch.
          # Clone or init gh-pages, place manifest, and push.
          GH_PAGES_DIR="$(mktemp -d)"
          trap 'rm -rf "$GH_PAGES_DIR"' EXIT

          # Authenticated remote URL — reused for BOTH the clone and the orphan
          # `git remote add` so the two cannot drift apart.
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git"

          # Distinguish "gh-pages branch does not exist yet" from a genuine
          # clone failure (network/auth), so a transient error does NOT silently
          # clobber history via a blind orphan re-init.
          CLONE_ERR="$(mktemp)"
          if git clone --branch gh-pages --depth 1 "$REMOTE_URL" "$GH_PAGES_DIR" 2>"$CLONE_ERR"; then
            rm -f "$CLONE_ERR"
          elif grep -q "Remote branch gh-pages not found" "$CLONE_ERR"; then
            rm -f "$CLONE_ERR"
            rm -rf "$GH_PAGES_DIR"
            mkdir -p "$GH_PAGES_DIR"
            git init "$GH_PAGES_DIR"
            cd "$GH_PAGES_DIR"
            git checkout --orphan gh-pages
            # A fresh `git init` has NO remotes — add `origin` before the push
            # below, otherwise `git push origin gh-pages` fails with
            # "fatal: 'origin' does not appear to be a git repository" (exit 128).
            git remote add origin "$REMOTE_URL"
            cd -
          else
            cat "$CLONE_ERR" >&2
            rm -f "$CLONE_ERR"
            echo "FATAL: git clone of gh-pages failed for a reason other than 'branch not found'" >&2
            exit 1
          fi

          cp manifest.json "$GH_PAGES_DIR/manifest.json"

          cd "$GH_PAGES_DIR"
          git add manifest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Update manifest.json for v${{ steps.version.outputs.value }}" \
              --allow-empty
          # --force-with-lease is safe here: the depth-1 clone above retained
          # refs/remotes/origin/gh-pages, so this refuses to overwrite if another
          # push landed in between (correct behavior for a racing sibling job).
          git push --force-with-lease origin gh-pages
          cd -
