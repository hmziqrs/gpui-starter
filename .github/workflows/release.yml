name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------------
  # Build the macOS .app bundle, optionally codesign + notarize, create DMG.
  # -----------------------------------------------------------------------
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    env:
      # Same discipline as ci.yml: large proc-macro stack (avoids SIGBUS),
      # CARGO_BUILD_JOBS=2 (the 14 GB runner swaps with more parallel rustc on
      # the heavy gpui/gpui_component crates), and many codegen units to keep
      # peak RSS down on a release build (optimization-heavy) so it doesn't OOM.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      RUST_MIN_STACK: "536870912"
      RUST_BACKTRACE: "1"
      # Bake the auto-update manifest URL into the binary at compile time
      # (option_env! in src/services/updater/types.rs). MUST match where the
      # publish-release job posts manifest.json (the gh-pages branch → GitHub
      # Pages). Requires GitHub Pages enabled on the gh-pages branch in repo
      # Settings (one-time manual step) for the URL to actually resolve.
      GPUI_UPDATE_MANIFEST_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-deps-
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-target-

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Strip ONE leading 'v' so a dispatch typo ("v0.2.0") and the tag form
          # ("v0.2.0") both normalize to "0.2.0" — otherwise we would push a
          # "vv0.2.0" tag and a manifest whose version fails semver parsing
          # client-side. Then validate it really is X.Y.Z.
          VALUE="${RAW#v}"
          if ! printf '%s' "$VALUE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: invalid version '$VALUE' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Create .app bundle
        id: appbundle
        run: |
          APP_PATH="$(./scripts/create-release-app.sh "${{ steps.version.outputs.value }}")"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # --- Codesigning ---------------------------------------------------
      # Import Developer ID certificate when available; otherwise ad-hoc sign.

      - name: Import signing certificate
        if: env.APPLE_DEV_CERT_P12 != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_DEV_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_DEV_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to keychain search list so codesign can find it.
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '"')"

      - name: Codesign with Developer ID
        if: env.APPLE_DEV_CERT_P12 != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          IDENTITY="${APPLE_SIGNING_IDENTITY:-'Developer ID Application'}"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" \
            "${{ steps.appbundle.outputs.path }}"

      - name: Ad-hoc codesign
        if: env.APPLE_DEV_CERT_P12 == ''
        run: |
          codesign --force --deep --sign - "${{ steps.appbundle.outputs.path }}"

      # --- Notarization --------------------------------------------------

      - name: Notarize
        if: env.APPLE_DEV_CERT_P12 != '' && env.APPLE_ID != ''
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="$(./scripts/create-dmg.sh \
            "${{ steps.appbundle.outputs.path }}" \
            "target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg")"

          # Submit for notarization.
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket.
          xcrun stapler staple "$DMG_PATH"

          echo "notarized_dmg=$DMG_PATH" >> "$GITHUB_ENV"

      # --- DMG creation (when not already created during notarization) ---

      - name: Create DMG
        if: env.notarized_dmg == ''
        run: |
          ./scripts/create-dmg.sh \
            "${{ steps.appbundle.outputs.path }}" \
            "target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg"

      - name: Determine final DMG path
        id: dmg
        run: |
          if [ -n "${notarized_dmg:-}" ]; then
            echo "path=${notarized_dmg}" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/release/GPUI-Starter-${{ steps.version.outputs.value }}.dmg" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPUI-Starter-${{ steps.version.outputs.value }}.dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Create GitHub Release and publish the update manifest to gh-pages.
  # -----------------------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          # Strip ONE leading 'v' (see the build-macos Determine version step
          # for rationale) and validate X.Y.Z.
          VALUE="${RAW#v}"
          if ! printf '%s' "$VALUE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: invalid version '$VALUE' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: GPUI-Starter-${{ steps.version.outputs.value }}.dmg
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            ./artifacts/GPUI-Starter-${{ steps.version.outputs.value }}.dmg

      - name: Generate and publish update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          GITHUB_REPO="${{ github.repository }}"

          # Install the Python signing dependency. ubuntu-latest does NOT ship
          # the `cryptography` module, so without this Ed25519 signing silently
          # no-ops (see scripts/generate-manifest.sh). Gated on the secret so
          # non-signing runs are a no-op.
          if [ -n "${UPDATE_SIGNING_KEY:-}" ]; then
            python3 -m pip install --user --break-system-packages cryptography
          fi

          # Generate manifest JSON from the GitHub Release assets.
          ./scripts/generate-manifest.sh \
            "${{ steps.version.outputs.value }}" \
            "$GITHUB_REPO" \
            manifest.json

          cat manifest.json

          # Publish manifest.json to the gh-pages branch.
          # Clone or init gh-pages, place manifest, and push.
          GH_PAGES_DIR="$(mktemp -d)"
          trap 'rm -rf "$GH_PAGES_DIR"' EXIT

          # Authenticated remote URL — reused for BOTH the clone and the orphan
          # `git remote add` so the two cannot drift apart.
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git"

          # Distinguish "gh-pages branch does not exist yet" from a genuine
          # clone failure (network/auth), so a transient error does NOT silently
          # clobber history via a blind orphan re-init.
          CLONE_ERR="$(mktemp)"
          if git clone --branch gh-pages --depth 1 "$REMOTE_URL" "$GH_PAGES_DIR" 2>"$CLONE_ERR"; then
            rm -f "$CLONE_ERR"
          elif grep -q "Remote branch gh-pages not found" "$CLONE_ERR"; then
            rm -f "$CLONE_ERR"
            rm -rf "$GH_PAGES_DIR"
            mkdir -p "$GH_PAGES_DIR"
            git init "$GH_PAGES_DIR"
            cd "$GH_PAGES_DIR"
            git checkout --orphan gh-pages
            # A fresh `git init` has NO remotes — add `origin` before the push
            # below, otherwise `git push origin gh-pages` fails with
            # "fatal: 'origin' does not appear to be a git repository" (exit 128).
            git remote add origin "$REMOTE_URL"
            cd -
          else
            cat "$CLONE_ERR" >&2
            rm -f "$CLONE_ERR"
            echo "FATAL: git clone of gh-pages failed for a reason other than 'branch not found'" >&2
            exit 1
          fi

          cp manifest.json "$GH_PAGES_DIR/manifest.json"

          cd "$GH_PAGES_DIR"
          git add manifest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Update manifest.json for v${{ steps.version.outputs.value }}" \
              --allow-empty
          # --force-with-lease is safe here: the depth-1 clone above retained
          # refs/remotes/origin/gh-pages, so this refuses to overwrite if another
          # push landed in between (correct behavior for a racing sibling job).
          git push --force-with-lease origin gh-pages
          cd -
