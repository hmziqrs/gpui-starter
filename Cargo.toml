[workspace]
members = [
	".",
]

[workspace.dependencies]
# gpui-form: sourced from the standalone checkout at /Users/hmziq/fo/form
gpui-form = { path = "/Users/hmziq/fo/form/crates/gpui-form" }
gpui-form-core = { path = "/Users/hmziq/fo/form/crates/gpui-form-core" }
gpui-form-schema = { path = "/Users/hmziq/fo/form/crates/gpui-form-schema" }
gpui-form-component = { path = "/Users/hmziq/fo/form/crates/gpui-form-component" }
gpui-form-component-derive = { path = "/Users/hmziq/fo/form/crates/gpui-form-component-derive" }
gpui-form-codegen = { path = "/Users/hmziq/fo/form/crates/gpui-form-codegen" }
gpui-form-derive = { path = "/Users/hmziq/fo/form/crates/gpui-form-derive" }

# GPUI ecosystem
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "e416af7f4dad861f251d357b6aa677dbc13a500e" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "e416af7f4dad861f251d357b6aa677dbc13a500e" }

# Serialization & data
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
strum = { version = "0.28", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
], default-features = false }

# i18n
rust-i18n = "3"
regex = "1"
es-fluent = { version = "0.16", features = ["derive"] }
es-fluent-build = "0.16"
es-fluent-lang = "0.16"
es-fluent-manager-embedded = "0.16"

# Validation
koruma = { version = "0.9", features = ["fluent"] }
koruma-collection = { version = "0.9", features = ["full-fluent"] }
koruma-derive-core = "0.9"

# Proc-macro infrastructure
darling = "0.23"
derive_more = { version = "2.1", features = ["full"] }
proc-macro-crate = "3.2"
proc-macro-error2 = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
syn-cfg-attr = "0.1"
prettyplease = "0.2"

# Form generation deps
bon = "3.9"
heck = "0.5.0"
inventory = "0.3"
itertools = "0.14"

# ICU / date / time
icu_calendar = "2.2.0"
icu_datetime = "2.2.0"
icu_locale_core = "2.2.0"
jiff = "0.2.23"
unic-langid = "0.9"

# Testing
insta = { version = "1", features = ["yaml"] }

[package]
name = "gpui-starter"
version = "0.2.0"
edition = "2024"
publish = false

[features]
# Enable OTLP export over HTTP/Protobuf for the telemetry module.
# See src/telemetry.rs for the full list of optional dependencies this pulls in.
otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
websocket = ["dep:tokio-tungstenite", "dep:tokio-stream"]

[dependencies]
gpui.workspace = true
gpui-query-legacy = { version = "0.1.4", features = ["hook"] }
gpui-query = { version = "0.1.4", features = ["hook"] }
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
rust-i18n.workspace = true
regex.workspace = true
koruma.workspace = true
koruma-collection.workspace = true
es-fluent.workspace = true
es-fluent-lang.workspace = true
es-fluent-manager-embedded.workspace = true
strum.workspace = true
gpui-form.workspace = true
user-notify = "0.4.2"
notify-rust = "4.17.0"
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
url = "2.5.8"
directories = "6.0.0"
atomic-write-file = "0.3.0"
semver = "1.0.28"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", optional = true, features = ["native-tls"] }
tokio-stream = { version = "0.1", optional = true }
tempfile = "3.27.0"
single-instance = "0.3.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = [
    "cookies",
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
network-interface = "2.0.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
opentelemetry = "0.24.0"
tracing-opentelemetry = "0.25.0"
# Optional: OTLP HTTP exporter for remote telemetry (enable with --features otlp)
opentelemetry-otlp = { version = "0.17.0", optional = true, features = [
    "http-proto",
    "reqwest-client",
] }
opentelemetry_sdk = { version = "0.24.1", optional = true, features = [
    "rt-tokio",
    "trace",
] }
open = "5.3.2"
arboard = "3.6.1"
rfd = "0.15.4"
notify = "8.2.0"
undo = "0.52.0"
accesskit = "0.21.1"
sys-locale = "0.3"

[dev-dependencies]
insta.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
global-hotkey = "0.8"
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.0", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[build-dependencies]
es-fluent-build.workspace = true


[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
# Toggle local gpui-query checkout: `just gpui-query-local` / `just gpui-query-cratesio`
# >>> gpui-query-local >>>
gpui-query = { path = "/Users/hmziq/fo/gpui-query/crates/gpui-query" }
gpui-query-legacy = { path = "/Users/hmziq/fo/gpui-query/crates/gpui-query-legacy" }
# <<< gpui-query-local <<<
