[workspace]
members = [
	".",
]

[workspace.dependencies]
# gpui-form: git-sourced from the standalone repo (NOT vendored
# in-tree, NOT crates.io — only the older 0.5.1 architecture is published
# there; the four -schema/-component*/-codegen crates were never published).
# All seven point at the SAME rev so cargo resolves them from one checkout.
# That repo floats its zed git deps exactly like this workspace and
# gpui-component@main do (unpinned, frozen by the lockfile) — pinning a rev
# HERE while they float would fork the graph into two gpui copies and a wall
# of cross-copy trait mismatches.
gpui-form = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-core = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-schema = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-component = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-component-derive = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-codegen = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }
gpui-form-derive = { git = "https://github.com/freeoxide/gpui-form", rev = "7f971b3971560a7d59734a235dc69d69d9e66044" }

# GPUI ecosystem
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", version = "=0.1.0", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77" }

# Serialization & data
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
strum = { version = "0.28", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["rt", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Logging & telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "registry",
], default-features = false }

# i18n
rust-i18n = "3"
regex = "1"
es-fluent = { version = "0.16", features = ["derive"] }
es-fluent-build = "0.16"
es-fluent-lang = "0.16"
es-fluent-manager-embedded = "0.16"

# Validation
koruma = { version = "0.9", features = ["fluent"] }
koruma-collection = { version = "0.9", features = ["full-fluent"] }
koruma-derive-core = "0.9"

# Proc-macro infrastructure
darling = "0.23"
derive_more = { version = "2.1", features = ["full"] }
proc-macro-crate = "3.2"
proc-macro-error2 = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
syn-cfg-attr = "0.1"
prettyplease = "0.2"

# Form generation deps
bon = "3.9"
heck = "0.5.0"
inventory = "0.3"
itertools = "0.14"

# ICU / date / time
icu_calendar = "2.2.0"
icu_datetime = "2.2.0"
icu_locale_core = "2.2.0"
jiff = "0.2.23"
unic-langid = "0.9"

# Testing
insta = { version = "1", features = ["yaml"] }

[package]
name = "gpui-starter"
version = "0.2.1"
edition = "2024"
publish = false
description = "A full-featured desktop application boilerplate built with GPUI (Zed's UI toolkit)"
repository = "https://github.com/freeoxide/gpui-starter"

[features]
# Enable OTLP export over HTTP/Protobuf for the telemetry module.
# See src/telemetry.rs for the full list of optional dependencies this pulls in.
otlp = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]
websocket = ["dep:tokio-tungstenite", "dep:tokio-stream"]
# AI chat streaming page (default OFF). flume is unconditional
# (services/streaming.rs needs it regardless), so this is an empty gate
# that only controls the ai_chat feature-page module.
ai-chat = []
# Wayland clipboard change monitor (default OFF, Linux-only). Activates the
# optional wayland deps + the monitor.rs module.
clipboard-history = ["dep:wayland-client", "dep:wayland-protocols-wlr"]
# XDG Desktop Portal notification backend for Flatpak/Snap/sandboxed runs
# (default OFF). When ON and running sandboxed, notifications route through
# org.freedesktop.portal.Notification via ashpd (reuses the transitive 0.13.x
# already compiled via gpui_linux/oo7). Native installs never need this.
notifications-portal = ["dep:ashpd"]

[dependencies]
gpui.workspace = true
# Version is a range (not `^0.1.4`) so the git override in [patch.crates-io]
# (0.1.4 + release-profile fix) actually satisfies this requirement and is
# applied. With a strict `^0.1.4`-only pin Cargo can silently drop a future
# patch as `[[patch.unused]]` and build the registry version regardless.
gpui-query = { version = ">=0.1.4, <0.3.0", features = ["hook"] }
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
rust-i18n.workspace = true
regex.workspace = true
koruma.workspace = true
koruma-collection.workspace = true
es-fluent.workspace = true
es-fluent-lang.workspace = true
es-fluent-manager-embedded.workspace = true
strum.workspace = true
gpui-form.workspace = true
user-notify = "0.4.2"
notify-rust = "4.17.0"
# Optional: XDG Desktop Portal notification backend (enable with --features notifications-portal).
# `notification` is required (ashpd gates its whole desktop::notification module behind it).
# `async-io` (NOT tokio) is required: notify-rust already forces zbus/async-io, and zbus forbids
# enabling both async-io and tokio. ashpd on async-io drives zbus's own background thread, so its
# futures are safe to await directly (like notify-rust's show_async).
ashpd = { version = "0.13", optional = true, default-features = false, features = ["notification", "async-io"] }
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
url = "2.5.8"
directories = "6.0.0"
atomic-write-file = "0.3.0"
semver = "1.0.28"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", optional = true, features = ["native-tls"] }
tokio-stream = { version = "0.1", optional = true }
tempfile = "3.27.0"
single-instance = "0.3.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = [
    "cookies",
    "json",
    "multipart",
    "rustls-tls",
    "stream",
] }
network-interface = "2.0.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
opentelemetry = "0.24.0"
tracing-opentelemetry = "0.25.0"
# Optional: OTLP HTTP exporter for remote telemetry (enable with --features otlp)
opentelemetry-otlp = { version = "0.17.0", optional = true, features = [
    "http-proto",
    "reqwest-client",
] }
opentelemetry_sdk = { version = "0.24.1", optional = true, features = [
    "rt-tokio",
    "trace",
] }
open = "5.3.2"
arboard = { version = "3.6.1", features = ["image-data"] }
rfd = "0.15.4"
notify = "8.2.0"
undo = "0.52.0"
accesskit = "0.21.1"
sys-locale = "0.3"
flume = "0.11"
fuzzy-matcher = "0.3"
rust-embed = "8"
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }

[dev-dependencies]
insta.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
global-hotkey = "0.8"
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSBundle",
    "NSError",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.0", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
es-fluent-build.workspace = true


[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }

[patch.crates-io]
# version selectors: the zed repo root carries 0.0.0 stub packages with the
# same names; without them cargo aborts with "resolved to more than one
# candidate" (the real crates live under crates/).
gpui = { git = "https://github.com/zed-industries/zed", version = "=0.2.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", version = "=0.1.0" }
gpui_macros = { git = "https://github.com/zed-industries/zed", version = "=0.1.0" }
# gpui-query source toggle: `just gpui-query-local` / `just gpui-query-cratesio`.
# DEFAULT (git): hmziqagent/gpui-query@f84eac4 = published v0.1.4 + one-line
# release-profile fix — no published version (0.1.4, 0.2.0, nor upstream
# master) compiles with debug_assertions off: the release-only fallback in
# hook/query_hooks.rs calls cx.new() without importing gpui::AppContext.
# Dev builds never compile that branch, which masked it. Drop this patch once
# a fixed version ships on crates.io. Keep exactly ONE line active — a
# duplicate gpui-query key is a TOML error.
# >>> gpui-query-local >>>
gpui-query = { git = "https://github.com/hmziqagent/gpui-query", rev = "f84eac4be3c46c1d7e5d8cffb8b6a898d4526f73" }
# gpui-query = { path = "/Users/hmziq/fo/gpui-query/crates/gpui-query" }
# <<< gpui-query-local <<<
